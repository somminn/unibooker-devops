apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: project-a

resources:
  - rollout-bluegreen.yaml
  - service-active.yaml
  - service-preview.yaml

images:
  - name: cowmin/project-a-backend
    newTag: "400eb843c87f31386a68a3202619a3de9adb7660"

configMapGenerator:
  - name: backend-config
    literals:
      - SERVER_PORT=8080
      - JPA_DDL_OPTION=update
      - CLOUDFRONT_URL=REPLACE_ME
      - MY_BUCKET=unibooker
      - AWS_REGION=ap-northeast-2

secretGenerator:
  - name: backend-secret
    type: Opaque
    literals:
      - JWT_SECRET=REPLACE_ME
      - SPRING_DATASOURCE_URL=REPLACE_ME
      - DB_USERNAME=root
      - DB_PASSWORD=REPLACE_ME
      - GMAIL_USERNAME=REPLACE_ME
      - GMAIL_PASSWORD=REPLACE_ME
      - S3_ACCESS_KEY=REPLACE_ME
      - S3_SECRET_KEY=REPLACE_ME

generatorOptions:
  disableNameSuffixHash: true