- name: Kubeadm prerequisites (Ubuntu, manual steps automated)
  hosts: k8s_cluster
  become: true
  gather_facts: true

  vars:
    kubernetes_apt_keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    kubernetes_apt_repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /"

  tasks:
    - name: apt update
      apt:
        update_cache: true

    - name: Install basic tools (net-tools)
      apt:
        name: net-tools
        state: present

    # --- swap off ---
    - name: Disable swap (runtime)
      shell: swapoff -a
      changed_when: false

    - name: Comment out swap entries in /etc/fstab (persist)
      replace:
        path: /etc/fstab
        regexp: '^(?!#)(.*\s+swap\s+sw\s+.*)$'
        replace: '# \1'

    # --- GRUB cgroup 설정 (cgroup v1 사용) ---
    - name: Ensure GRUB_CMDLINE_LINUX uses systemd.unified_cgroup_hierarchy=0
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX='
        line: 'GRUB_CMDLINE_LINUX="systemd.unified_cgroup_hierarchy=0"'
        create: false

    - name: update-grub
      shell: update-grub
      changed_when: false

    # --- iptables legacy ---
    # update-alternatives는 인터랙티브라서, legacy가 있으면 자동으로 legacy로 세팅
    - name: Set iptables to legacy if available
      shell: |
        set -e
        if update-alternatives --list iptables 2>/dev/null | grep -q iptables-legacy; then
          update-alternatives --set iptables /usr/sbin/iptables-legacy
        fi
        if update-alternatives --list ip6tables 2>/dev/null | grep -q ip6tables-legacy; then
          update-alternatives --set ip6tables /usr/sbin/ip6tables-legacy
        fi
      changed_when: false

    # --- containerd 설치 ---
    - name: Install containerd
      apt:
        name: containerd
        state: present

    # --- 가상 네트워크(sysctl) ---
    - name: Configure sysctl for Kubernetes networking
      copy:
        dest: /etc/sysctl.d/99-k8s-cri.conf
        content: |
          net.bridge.bridge-nf-call-iptables=1
          net.bridge.bridge-nf-call-ip6tables=1
          net.ipv4.ip_forward=1

    - name: Apply sysctl
      shell: sysctl --system
      changed_when: false

    # --- 커널 모듈 ---
    - name: Load kernel modules now
      shell: |
        modprobe overlay
        modprobe br_netfilter
      changed_when: false

    - name: Persist kernel modules
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    # --- kubeadm/kubelet/kubectl 설치 ---
    - name: Add Kubernetes apt keyring
      shell: |
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key \
          | gpg --dearmor -o {{ kubernetes_apt_keyring }}
      args:
        creates: "{{ kubernetes_apt_keyring }}"

    - name: Add Kubernetes apt repository
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: "{{ kubernetes_apt_repo }}\n"

    - name: apt update (kubernetes repo)
      apt:
        update_cache: true

    - name: Install kubeadm kubelet kubectl
      apt:
        name:
          - kubeadm
          - kubelet
          - kubectl
        state: present

    # --- kubelet cgroup driver ---
    - name: Set kubelet extra args (cgroupfs)
      copy:
        dest: /etc/default/kubelet
        content: |
          KUBELET_EXTRA_ARGS="--cgroup-driver=cgroupfs"

    # --- containerd KillMode ---
    - name: Ensure containerd service KillMode=mixed
      lineinfile:
        path: /usr/lib/systemd/system/containerd.service
        regexp: '^KillMode='
        line: 'KillMode=mixed'

    - name: systemctl daemon-reload
      shell: systemctl daemon-reload
      changed_when: false

    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: true

    - name: Restart kubelet
      systemd:
        name: kubelet
        state: restarted
        enabled: true